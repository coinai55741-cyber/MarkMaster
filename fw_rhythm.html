<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>跟著節拍點火｜試玩</title>
<link rel="stylesheet" href="fw_common.css">
<style>
  .spacer { flex: 1; }
  .count { font-size: 64px; font-weight: 800; color: var(--gold); min-height: 80px; }
  .fire { width: min(420px, 92vw); height: 120px; border-radius: 20px; border: 2px solid var(--gold); background: rgba(255,211,107,.1);
          color: var(--ink); font: inherit; font-size: 26px; font-weight: 700; cursor: pointer; }
  .fire:active { background: rgba(255,211,107,.3); }
  .fire:disabled { opacity: .35; }
  .row { display: flex; gap: 10px; margin-top: 12px; }
  .hint { margin-top: 8px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="ui" id="ui" hidden>
  <div class="hud"><span>第 <b id="wno">1</b> / <b id="wn">3</b> 詞</span><span class="grow"></span><span>得分 <b id="sc">0.00</b></span></div>
  <div class="word" id="word"></div>
  <div class="meaning" id="meaning"></div>
  <div class="msg" id="msg"></div>
  <div class="spacer"></div>
  <div class="count" id="count"></div>
  <button class="fire" id="fire" disabled>點火！</button>
  <div class="row"><button class="btn ghost" id="demo">🔊 先聽一次</button><button class="btn" id="go">換我點火</button></div>
  <div class="hint">先聽一次，再按「換我點火」：倒數後會播讀音，每唸到一個字就按一下（或按空白鍵）</div>
</div>

<div class="panel" id="startPanel">
  <div class="card">
    <h1>跟著節拍點火</h1>
    <p>聽客語，每唸一個音節就點一次火。<br>點得越準，煙火越大。共 3 個詞，每個詞可以先聽一次。</p>
    <div class="chips" id="dialects"></div>
    <button class="btn" id="startBtn">開始</button>
    <div class="note">音節時間點是由音檔自動估計的，少數詞可能不準</div>
  </div>
</div>
<div class="panel" id="endPanel" hidden>
  <div class="card">
    <h1>節拍煙火結束</h1>
    <div class="big" id="endScore">0.00</div><p style="margin:0">／ 20 分</p>
    <div class="rows" id="endRows"></div>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>
<audio id="voice"></audio>
<script src="fireworks_data.js"></script>
<script src="fw_sfx.js"></script>
<script src="fw_engine.js"></script>
<script>
FW.init(document.getElementById("sky"));
const $ = id => document.getElementById(id), voice = $("voice");
const st = { dialect: new URLSearchParams(location.search).get("dialect") || "四縣腔", words: [], wi: 0, taps: [], playing: false, scores: [], log: [] };
const PERFECT = .06, ZERO = .32;   // 誤差 60ms 內滿分，320ms 以上 0 分


function renderWord() {
  const w = st.words[st.wi];
  $("wno").textContent = st.wi + 1;
  $("word").innerHTML = w.h.map((h, i) => `<div class="ch"><div class="h">${h}</div><div class="p">${w.p[i]}</div></div>`).join("");
  $("meaning").textContent = w.m; $("msg").textContent = ""; $("count").textContent = "";
  $("fire").disabled = true; $("go").disabled = false; $("demo").disabled = false;
}
const chAt = i => $("word").children[i];
const fireAbove = (i, power) => { const r = chAt(i).getBoundingClientRect(); FW.launch(r.left + r.width / 2, r.top - 30 + Math.random() * 20, { power, n: 90, ring: power > .85 }); };

// 示範：照估計的時間點自動放煙火
$("demo").onclick = () => {
  const w = st.words[st.wi];
  voice.src = w.s; voice.currentTime = 0; voice.play().catch(() => {});
  w.on.forEach((t, i) => setTimeout(() => { chAt(i).classList.add("now"); fireAbove(i, .5); setTimeout(() => chAt(i).classList.remove("now"), 250); }, t * 1000));
};

$("go").onclick = () => {
  $("go").disabled = true; $("demo").disabled = true;
  let n = 3; $("count").textContent = n; SFX.count(false);
  const iv = setInterval(() => {
    n--;
    if (n > 0) { $("count").textContent = n; SFX.count(false); return; }
    clearInterval(iv); $("count").textContent = ""; SFX.count(true);
    const w = st.words[st.wi];
    st.taps = []; st.playing = true; $("fire").disabled = false; $("fire").focus();
    voice.src = w.s; voice.currentTime = 0; voice.play().catch(() => {});
    voice.onended = () => setTimeout(endWord, 350);
  }, 600);
};

function tap() {
  if (!st.playing) return;
  const w = st.words[st.wi], k = st.taps.length, t = voice.currentTime;
  st.taps.push(t);
  if (k >= w.on.length) { SFX.buzz(); $("msg").className = "msg bad"; $("msg").textContent = "多按了一下"; return; }
  SFX.tap();
  const dt = t - w.on[k], s = Math.max(0, Math.min(1, 1 - (Math.abs(dt) - PERFECT) / (ZERO - PERFECT)));
  chAt(k).classList.add("done");
  if (s > 0) fireAbove(k, s); else { const r = chAt(k).getBoundingClientRect(); FW.dud(r.left + r.width / 2, r.top); }
  if (s >= .9) SFX.ding(2);
  const label = s >= .9 ? "完美！" : s >= .6 ? "很好" : dt < 0 ? "偏早" : "偏晚";
  $("msg").className = "msg " + (s >= .9 ? "good" : s >= .6 ? "mid" : "bad");
  $("msg").textContent = `${label}（${dt >= 0 ? "+" : ""}${Math.round(dt * 1000)} ms）`;
}
$("fire").addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); tap(); } });

function endWord() {
  if (!st.playing) return;
  st.playing = false; $("fire").disabled = true;
  const w = st.words[st.wi], extra = Math.max(0, st.taps.length - w.on.length);
  w.on.forEach((on, k) => {
    const t = st.taps[k], dt = t === undefined ? null : t - on;
    const s = dt === null ? 0 : Math.max(0, Math.min(1, 1 - (Math.abs(dt) - PERFECT) / (ZERO - PERFECT)));
    st.scores.push(Math.max(0, s - .1 * (k === w.on.length - 1 ? extra : 0)));   // 多按的次數扣在最後一個音節
    st.log.push([w.h[k], dt]);
  });
  $("sc").textContent = (20 * st.scores.reduce((a, b) => a + b, 0) / totalSyl()).toFixed(2);
  // 一個詞結束：看這個詞的平均分給音效
  const avg = st.scores.slice(-w.on.length).reduce((a, b) => a + b, 0) / w.on.length;
  setTimeout(() => avg >= .4 ? SFX.ding(avg >= .9 ? 2 : avg >= .65 ? 1 : 0) : SFX.buzz(), 250);
  st.wi++;
  setTimeout(() => st.wi < st.words.length ? renderWord() : finish(), 900);
}
const totalSyl = () => st.words.reduce((n, w) => n + w.on.length, 0);

function start() {
  Object.assign(st, { words: FWU.pick(FW_WORDS[st.dialect], [2, 3, 4]), wi: 0, scores: [], log: [], playing: false });
  $("wn").textContent = st.words.length; $("sc").textContent = "0.00";
  $("startPanel").hidden = $("endPanel").hidden = true; $("ui").hidden = false;
  renderWord();
}
function finish() {
  const total = Math.round(2000 * st.scores.reduce((a, b) => a + b, 0) / st.scores.length) / 100;
  for (let k = 0; k < 6; k++) setTimeout(() => FW.launch(FW.W * (.15 + .7 * Math.random()), FW.H * (.15 + .3 * Math.random()), { n: 110, ring: true }), k * 200);
  setTimeout(() => {
    $("ui").hidden = true; $("endPanel").hidden = false; SFX.fanfare();
    $("endScore").textContent = total.toFixed(2);
    $("endRows").innerHTML = st.log.map(([h, dt]) => `<div><span>${h}</span><b>${dt === null ? "沒按到" : `${dt >= 0 ? "+" : ""}${Math.round(dt * 1000)} ms`}</b></div>`).join("");
    FWU.report({ type: "fireworks-complete", mode: "rhythm", score: total });
  }, 1500);
}
const chips = (el, items, get, set) => { el.innerHTML = ""; for (const k of items) { const b = document.createElement("button"); b.className = "chip"; b.textContent = k; b.setAttribute("aria-pressed", k === get()); b.onclick = () => { set(k); [...el.children].forEach(c => c.setAttribute("aria-pressed", c === b)); }; el.appendChild(b); } };
chips($("dialects"), Object.keys(FW_WORDS), () => st.dialect, v => st.dialect = v);
FWX.mount({
  title: "跟著節拍點火 玩法",
  steps: [
    "先按 <b>🔊 先聽一次</b>：會唸一次這個詞，並在每個音節自動放一支煙火給你看節奏。",
    "準備好了按 <b>換我點火</b>，聽到「嗶、嗶、嗶——」倒數後開始唸。",
    "每聽到<b>一個音節</b>（一個字）就按一下 <b>點火！</b>，電腦可以按<b>空白鍵</b>。",
    "按得越準，煙火越大；按完一個詞會自動換下一個。",
  ],
  tips: ["和音節起點差 60 毫秒內滿分，差 320 毫秒以上 0 分。", "多按會扣分，漏按那個字 0 分。"],
});
$("startBtn").onclick = FWX.firstHelp(start); $("againBtn").onclick = start;
</script>
</body>
</html>
