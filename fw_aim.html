<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>瞄準引爆｜試玩</title>
<link rel="stylesheet" href="fw_common.css">
<style>
  #field { position: fixed; inset: 0; pointer-events: none; }
  .rk { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .rk .lab { padding: 6px 12px; border-radius: 10px; background: var(--tile); border: 2px solid var(--tile-line); font-size: 20px; white-space: nowrap; }
  .rk .body { width: 10px; height: 34px; border-radius: 5px 5px 2px 2px; background: linear-gradient(#ffe6a8, #ff9e5e); margin-top: 4px; }
  .rk .flame { width: 8px; height: 14px; border-radius: 50%; background: #ffcf7a; filter: blur(2px); animation: fl .12s infinite alternate; }
  @keyframes fl { to { transform: scaleY(1.5); opacity: .6; } }
  #line { position: fixed; left: 0; right: 0; height: 0; border-top: 2px dashed rgba(255,211,107,.6); pointer-events: none; }
  #line span { position: absolute; right: 12px; top: -22px; font-size: 12px; color: var(--gold); }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="line" hidden><span>引爆線</span></div>
<div id="field"></div>
<div class="ui" id="ui" hidden>
  <div class="hud"><span>第 <b id="wno">1</b> / <b id="wn">3</b> 詞</span><span class="grow"></span><span>得分 <b id="sc">0.00</b></span></div>
  <div class="word" id="word"></div>
  <div class="meaning" id="meaning"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="hint" id="hint" hidden>三支煙火依序升空：對的拼音碰到虛線時按「空白鍵」引爆（手機：點畫面任何地方；也可以直接點火箭）</div>

<div class="panel" id="startPanel">
  <div class="card">
    <h1>瞄準引爆</h1>
    <p>每個字會有三支煙火依序升空，只有一支的拼音是對的。<br>等對的那支碰到「引爆線」時按<b>空白鍵</b>引爆，越貼近線分數越高；<br>按到錯的那支就變啞炮。</p>
    <div class="chips" id="dialects"></div>
    <button class="btn" id="startBtn">開始</button>
  </div>
</div>
<div class="panel" id="endPanel" hidden>
  <div class="card">
    <h1>引爆結束</h1>
    <div class="big" id="endScore">0.00</div><p style="margin:0">／ 20 分</p>
    <div class="rows" id="endRows"></div>
    <button class="btn" id="againBtn">再玩一次</button>
  </div>
</div>
<audio id="voice"></audio>
<script src="fireworks_data.js"></script>
<script src="fw_sfx.js"></script>
<script src="fw_engine.js"></script>
<script>
FW.init(document.getElementById("sky"));
const $ = id => document.getElementById(id);
const st = { dialect: new URLSearchParams(location.search).get("dialect") || "四縣腔", words: [], wi: 0, si: 0, scores: [], log: [], rockets: [], lineY: 0, live: false };
const TONE = /[ˊˇˋ⁺ˆ]+$/, MARKS = ["", "ˊ", "ˇ", "ˋ", "⁺", "ˆ"];

// 兩個陷阱：一個換聲調，一個用同詞別的音節（不夠就再換一個聲調）
function decoys(w, i) {
  const right = w.p[i], base = right.replace(TONE, ""), out = new Set();
  const tone = FWU.shuffle(MARKS).map(m => base + m).find(x => x !== right);
  if (tone) out.add(tone);
  const other = FWU.shuffle(w.p.filter(x => x !== right && !out.has(x)))[0];
  if (other) out.add(other);
  for (const m of FWU.shuffle(MARKS)) { if (out.size >= 2) break; const x = base + m; if (x !== right) out.add(x); }
  return [...out].slice(0, 2);
}

function renderWord() {
  const w = st.words[st.wi];
  $("wno").textContent = st.wi + 1;
  $("word").innerHTML = w.h.map((h, i) => `<div class="ch${i === st.si ? " now" : ""}"><div class="h">${h}</div><div class="p">${i < st.si ? w.p[i] : "？"}</div></div>`).join("");
  $("meaning").textContent = w.m;
  const v = $("voice"); v.src = w.s; v.play().catch(() => {});
}

function launchSet() {
  const w = st.words[st.wi], right = w.p[st.si];
  const labels = FWU.shuffle([right, ...decoys(w, st.si)]);
  const xs = FWU.shuffle([.22, .5, .78]);
  st.lineY = FW.H * .42; const line = $("line"); line.hidden = false; line.style.top = st.lineY + "px";
  const speed = FW.H * (.28 + .04 * (st.scores.length % 6)) * (.9 + Math.random() * .2);   // 每秒移動距離，越後面越快
  const gap = speed * .55;   // 三支依序到線，間隔約 0.55 秒，按空白鍵時才分得出是哪一支
  $("field").innerHTML = "";
  st.rockets = labels.map((p, k) => {
    const el = document.createElement("div");
    el.className = "rk"; el.innerHTML = `<div class="lab">${p}</div><div class="body"></div><div class="flame"></div>`;
    $("field").appendChild(el);
    const r = { p, right: p === right, x: FW.W * xs[k], y: FW.H + 60 + k * gap, v: speed, el, gone: false };
    el.addEventListener("pointerdown", e => { e.preventDefault(); hit(r); });
    return r;
  });
  st.live = true;
  SFX.whoosh(FW.W / 2, 1.1);
}

FW.onFrame((cx, t, dt) => {
  if (!st.live) return;
  for (const r of st.rockets) {
    if (r.gone) continue;
    r.y -= r.v * dt;
    r.el.style.left = r.x + "px"; r.el.style.top = r.y + "px";
    if (r.y < 40) { r.gone = true; r.el.remove(); if (r.right) { SFX.buzz(); resolve(0, "錯過了", null); } }
  }
});

// 空白鍵（或點畫面空白處）：引爆「最靠近引爆線」的那一支
function detonateNearest() {
  if (!st.live) return;
  const alive = st.rockets.filter(r => !r.gone && r.y < FW.H);
  if (!alive.length) return;
  const near = alive.reduce((a, b) => Math.abs(a.y - 28 - st.lineY) <= Math.abs(b.y - 28 - st.lineY) ? a : b);
  hit(near);
}
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); detonateNearest(); } });
addEventListener("pointerdown", e => { if (st.live && !e.target.closest(".rk") && !e.target.closest("button")) detonateNearest(); });

function hit(r) {
  if (!st.live || r.gone) return;
  // 標籤中心在火箭上方，以標籤中心當引爆點
  const dy = r.y - 28 - st.lineY;
  r.gone = true; r.el.remove();
  if (!r.right) { FW.dud(r.x, r.y); SFX.buzz(); return resolve(0, `${r.p} 不對`, dy); }
  const s = Math.max(0, Math.min(1, 1 - (Math.abs(dy) - 6) / 110));
  FW.burst(r.x, r.y - 28, { power: s, n: 100, ring: s > .85 });
  s >= .3 ? SFX.ding(s >= .9 ? 2 : s >= .6 ? 1 : 0) : SFX.buzz();
  resolve(s, s >= .9 ? "正中引爆線！" : s >= .6 ? "很接近" : dy > 0 ? "太早了" : "太晚了", dy);
}

function resolve(s, text, dy) {
  if (!st.live) return;
  st.live = false;
  for (const r of st.rockets) if (!r.gone) { r.gone = true; FW.dud(r.x, r.y, true); r.el.remove(); }
  $("line").hidden = true;
  const w = st.words[st.wi];
  st.scores.push(s); st.log.push([w.h[st.si], w.p[st.si], s]);
  $("msg").className = "msg " + (s >= .9 ? "good" : s >= .6 ? "mid" : "bad"); $("msg").textContent = text;
  $("sc").textContent = (20 * st.scores.reduce((a, b) => a + b, 0) / totalSyl()).toFixed(2);
  st.si++;
  if (st.si >= w.p.length) { st.si = 0; st.wi++; }
  setTimeout(() => {
    $("msg").textContent = "";
    if (st.wi >= st.words.length) return finish();
    renderWord(); setTimeout(launchSet, 500);
  }, 900);
}
const totalSyl = () => st.words.reduce((n, w) => n + w.p.length, 0);

function start() {
  Object.assign(st, { words: FWU.pick(FW_WORDS[st.dialect], [2, 3, 3]), wi: 0, si: 0, scores: [], log: [], live: false });
  $("wn").textContent = st.words.length; $("sc").textContent = "0.00";
  $("startPanel").hidden = $("endPanel").hidden = true; $("ui").hidden = false; $("hint").hidden = false;
  renderWord(); setTimeout(launchSet, 900);
}
function finish() {
  const total = Math.round(2000 * st.scores.reduce((a, b) => a + b, 0) / st.scores.length) / 100;
  $("hint").hidden = true;
  for (let k = 0; k < 6; k++) setTimeout(() => FW.launch(FW.W * (.15 + .7 * Math.random()), FW.H * (.15 + .3 * Math.random()), { n: 110, ring: true }), k * 200);
  setTimeout(() => {
    $("ui").hidden = true; $("endPanel").hidden = false; SFX.fanfare();
    $("endScore").textContent = total.toFixed(2);
    $("endRows").innerHTML = st.log.map(([h, p, s]) => `<div><span>${h}　${p}</span><b>${Math.round(s * 100)}</b></div>`).join("");
    FWU.report({ type: "fireworks-complete", mode: "aim", score: total });
  }, 1500);
}
const chips = (el, items, get, set) => { el.innerHTML = ""; for (const k of items) { const b = document.createElement("button"); b.className = "chip"; b.textContent = k; b.setAttribute("aria-pressed", k === get()); b.onclick = () => { set(k); [...el.children].forEach(c => c.setAttribute("aria-pressed", c === b)); }; el.appendChild(b); } };
chips($("dialects"), Object.keys(FW_WORDS), () => st.dialect, v => st.dialect = v);
FWX.mount({
  title: "瞄準引爆 玩法",
  steps: [
    "聽讀音，看<b>黃框</b>的字：要找出這個字的正確拼音。",
    "三支煙火會帶著不同拼音往上飛，其中<b>只有一支是對的</b>。",
    "等對的那支碰到<b>黃色引爆線</b>時點它引爆。電腦可按<b>空白鍵</b>，會引爆最靠近線的那支。",
    "越貼近引爆線，煙火越大、分數越高。",
  ],
  tips: ["點到錯的拼音、或讓對的那支飛走，這個字 0 分。", "越後面的字飛得越快。"],
});
$("startBtn").onclick = FWX.firstHelp(start); $("againBtn").onclick = start;
</script>
</body>
</html>
