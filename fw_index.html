<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>煙火小遊戲試玩</title>
<link rel="stylesheet" href="fw_common.css">
<style>
  html, body { overflow: auto; touch-action: auto; user-select: auto; }
  .wrap { position: relative; max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  a.game { display: block; text-decoration: none; color: var(--ink); background: #18224a; border: 1px solid var(--tile-line); border-radius: 16px; padding: 18px; }
  a.game:hover { border-color: var(--gold); }
  a.game h2 { margin: 0 0 6px; font-size: 20px; }
  a.game p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .tag { display: inline-block; font-size: 12px; color: var(--gold); margin-bottom: 6px; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <h1>煙火小遊戲試玩</h1>
  <p class="sub">最後 20 分的小遊戲候選。分數都算到小數點後兩位，用來拉開排行榜差距。</p>
  <div class="grid">
    <a class="game" href="fw_tone.html"><span class="tag">練聲調</span><h2>畫聲調升空</h2><p>照聲調畫一筆，煙火沿著你畫的線飛上天。看畫得多像標準調型給分。</p></a>
    <a class="game" href="fw_rhythm.html"><span class="tag">練聽力・節奏</span><h2>跟著節拍點火</h2><p>聽客語，每唸一個音節就點一次火。看和音節起點差幾毫秒給分。</p></a>
    <a class="game" href="fw_aim.html"><span class="tag">練拼音・反應</span><h2>瞄準引爆</h2><p>三支煙火帶拼音升空，挑對的那支、在碰到引爆線時點它。看離線多近給分。</p></a>
    <a class="game" href="fireworks.html"><span class="tag">第一版</span><h2>煙火連線</h2><p>從客字拉引信到拼音，連對放煙火。看正確率和剩餘時間給分。</p></a>
  </div>
</div>
<script src="fw_engine.js"></script>
<script>
FW.init(document.getElementById("sky"));
setInterval(() => FW.launch(FW.W * (.1 + .8 * Math.random()), FW.H * (.1 + .35 * Math.random()), { n: 80, power: .6 }), 1400);
</script>
</body>
</html>
