<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>午休驅魔記｜第一關題目檢查</title>
<!-- 檢查用：不玩遊戲，直接列出全部題目（隨機順序），用和遊戲相同的規則抽誘答，確認題目、答案、誘答合不合情境。
     資料：data.js（window.QUIZ）；音檔：audio/<腔>/<序號>.mp3
     抽誘答規則同 dream1.html 的 buildRound()。
     標記：存在這台瀏覽器的 localStorage（quizCheckMarks.v1）；按「複製標記」把文字貼給 Claude，再改進 make_pairs.py。
     題號 id 與句子序號 6 腔共用，所以在任一腔標的，6 腔都算。 -->
<style>
  :root { --bg:#f6f3ee; --card:#fff; --ink:#2a2530; --sub:#7a7280; --line:#e4dfd8; --ok:#1f9d55; --okbg:#e8f6ee; --near:#c27a00; --far:#5a6acf; --acc:#6b3fa0; --bad:#d64545; --badbg:#fdecec; --warn:#e08a00; --warnbg:#fff4e0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: #2a2530; color: #fff; padding: 8px 16px; }
  header .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 2px 0; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  header label { font-size: 14px; display: flex; align-items: center; gap: 6px; }
  header select, header button { font: inherit; font-size: 14px; padding: 4px 10px; border-radius: 6px; border: 0; }
  header button { background: #f2c94c; color: #2a2530; font-weight: 700; cursor: pointer; }
  header button.ghost { background: transparent; color: #fff; border: 1px solid #ffffff55; font-weight: 400; }
  header .note { font-size: 13px; opacity: .75; }
  #markCount { font-size: 14px; background: #ffffff1f; padding: 2px 10px; border-radius: 99px; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  .legend { font-size: 13px; color: var(--sub); margin-bottom: 12px; }
  .legend b { padding: 1px 6px; border-radius: 4px; color: #fff; font-weight: 500; }
  .q { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .q.marked { border-left-color: var(--bad); }
  .onlyMarked .q:not(.marked) { display: none; }
  .q-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  .q-no { font-weight: 800; font-size: 18px; color: var(--acc); }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 99px; background: #efe9f6; color: var(--acc); }
  .tag.id { background: #eee; color: #666; }
  .line { display: grid; grid-template-columns: 64px 32px 1fr; gap: 6px; align-items: start; padding: 4px 0; }
  .line .who { font-size: 13px; color: var(--sub); padding-top: 3px; }
  .hk { font-size: 18px; font-weight: 600; }
  .zh { font-size: 14px; color: var(--sub); }
  .py { font-size: 12px; color: #a39bab; }
  .spk { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #faf8f5; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
  .spk.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  .bar { display: flex; align-items: center; gap: 10px; margin: 8px 0 10px; }
  .bar button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--acc); background: #fff; color: var(--acc); cursor: pointer; white-space: nowrap; }
  .bar input { flex: 1; accent-color: var(--acc); }
  .bar .t { font-size: 12px; color: var(--sub); min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
  .opts { border-top: 1px dashed var(--line); padding-top: 8px; }
  .opt { display: grid; grid-template-columns: 26px 32px 1fr auto; gap: 6px; align-items: start; padding: 6px 8px; border-radius: 8px; }
  .opt.right { background: var(--okbg); }
  .opt.m-wrong { background: var(--badbg); }
  .opt.m-also { background: var(--warnbg); }
  .opt .k { font-weight: 800; padding-top: 2px; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .kind { font-size: 12px; padding: 1px 8px; border-radius: 4px; color: #fff; white-space: nowrap; }
  .kind.ok { background: var(--ok); } .kind.near { background: var(--near); } .kind.far { background: var(--far); }
  .kind small { opacity: .85; }
  .hideAns .opt.right:not(.m-wrong) { background: transparent; } .hideAns .kind { visibility: hidden; }
  /* 標記按鈕 */
  .mk { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid #cfc8d6; background: #fff; color: #5d5566; cursor: pointer; white-space: nowrap; }
  .mk:hover { border-color: var(--acc); color: var(--acc); }
  .mk.on { color: #fff; border-color: transparent; }
  .mk.wrong.on, .mk.none.on, .mk.bad.on { background: var(--bad); }
  .mk.also.on { background: var(--warn); }
  .qmarks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .qmarks .lbl { font-size: 13px; color: var(--sub); }
  .qmarks input { flex: 1 1 220px; font: inherit; font-size: 14px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .others { width: 100%; font-size: 13px; color: var(--warn); }
  /* 匯出視窗 */
  dialog { border: 0; border-radius: 14px; padding: 18px; width: min(720px, 94vw); box-shadow: 0 20px 60px #0005; }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog p { margin: 0 0 10px; font-size: 14px; color: var(--sub); }
  dialog textarea { width: 100%; height: 50vh; font: 13px/1.5 ui-monospace, Consolas, "Microsoft JhengHei", monospace; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  dialog .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
  dialog button { font: inherit; font-size: 14px; padding: 6px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  dialog button.pri { background: var(--acc); color: #fff; border-color: var(--acc); }
  @media (max-width: 599px) {
    .line { grid-template-columns: 1fr 32px; } .line .who { grid-column: 1 / -1; padding: 0; } .line .spk { grid-row: 2; grid-column: 2; } .line .txt { grid-row: 2; grid-column: 1; }
    .opt { grid-template-columns: 22px 32px 1fr; } .opt .side { grid-column: 2 / -1; flex-direction: row; justify-content: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>第一關題目檢查</h1>
    <label>腔調 <select id="dia"></select></label>
    <label>難度 <select id="lv">
      <option value="easy">初級（2 個遠誘答）</option>
      <option value="mid">中級（近 1＋遠 1）</option>
      <option value="hard">進階（2 個近誘答）</option>
    </select></label>
    <button id="again">重新抽</button>
    <label><input type="checkbox" id="hide"> 先藏答案</label>
    <span class="note" id="count"></span>
  </div>
  <div class="row">
    <span id="markCount">已標 0 題</span>
    <label><input type="checkbox" id="onlyMarked"> 只看有標記的</label>
    <button id="export">複製標記給 Claude</button>
    <button id="clearAll" class="ghost">清除全部標記</button>
  </div>
</header>
<main>
  <div class="legend">每次都把該腔全部題目隨機排序，誘答用和遊戲一樣的規則抽。
    <b style="background:var(--ok)">正解</b>
    <b style="background:var(--near)">近誘答</b> 同一段對話、答非所問
    <b style="background:var(--far)">遠誘答</b> 別的主題的答句（括號是它原本的主題）<br>
    <b style="background:var(--bad)">✗ 這不是答案</b> 正解其實不對
    <b style="background:var(--warn)">✓ 這也可以</b> 誘答其實也說得通（變成兩個都對）
    題目下方還有「都不是答案」「題目有問題」和備註。標記會記在這台瀏覽器裡，6 個腔共用；標完按「複製標記給 Claude」貼到對話。</div>
  <div id="list"></div>
</main>
<dialog id="dlg">
  <h2>標記內容</h2>
  <p id="dlgMsg">已複製到剪貼簿，直接貼到對話框給 Claude 就可以。</p>
  <textarea id="dlgText" readonly></textarea>
  <div class="acts"><button id="dlgCopy" class="pri">再複製一次</button><button id="dlgClose">關閉</button></div>
</dialog>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const AUDIO = "";
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const no = L => +(/\/(\d+)\.mp3$/.exec(L.s) || [])[1];   // 句子序號（6 腔共用）

for (const d of Object.keys(QUIZ)) $("dia").add(new Option(d, d));
const qs = new URLSearchParams(location.search);
if (qs.get("level")) $("lv").value = qs.get("level");

// ---- 標記：{ 題號: { o: { 句子序號: "wrong"|"also" }, none, bad, note, dia, t } } ----
const KEY = "quizCheckMarks.v1";
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch { marks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch {} };
const isEmpty = m => !m || (!m.none && !m.bad && !(m.note || "").trim() && !Object.keys(m.o || {}).length);
function markOf(id, create) {
  if (!marks[id] && create) marks[id] = { o: {} };
  return marks[id];
}
function touch(id) {
  const m = marks[id];
  if (isEmpty(m)) delete marks[id]; else { m.dia = $("dia").value; m.t = Date.now(); }
  save(); updateCount();
}
function updateCount() { $("markCount").textContent = `已標 ${Object.keys(marks).length} 題`; }

// 同 dream1.html buildRound()，只是不只抽 7 題：全部題目洗牌
function build() {
  const bank = QUIZ[$("dia").value], level = $("lv").value;
  return shuffle(bank).map(item => {
    const far = bank.filter(x => x.decoy && x.topic !== item.topic && x.a.h !== item.a.h).map(x => ({ ...x.a, kind: "far", from: x.topic }));
    const near = item.near.map(x => ({ ...x, kind: "near" }));
    const wrong = level === "hard" ? near : level === "mid" ? [pick(near, 1)[0], pick(far, 1)[0]] : pick(far, 2);
    return { item, opts: shuffle([{ ...item.a, kind: "ok" }, ...wrong]) };
  });
}

// 某腔所有句子：序號 → { 句子, 主題 }（匯出時用來找標記過、但這次沒抽到的誘答）
function lineIndex(dia) {
  const m = new Map();
  for (const x of QUIZ[dia]) for (const L of [...x.ctx, x.q, x.a, ...x.near]) if (!m.has(no(L))) m.set(no(L), { L, topic: x.topic });
  return m;
}

const lineHTML = (who, L) => `<div class="line"><span class="who">${who}</span>
  <button class="spk" data-src="${esc(L.s)}" title="播放這句">🔊</button>
  <div class="txt"><div class="hk">${esc(L.h)}</div><div class="zh">${esc(L.m)}</div><div class="py">${esc(L.p)}</div></div></div>`;

let round = [];
function render() {
  stop();
  round = build();
  $("count").textContent = `共 ${round.length} 題`;
  $("list").innerHTML = round.map(({ item, opts }, i) => `
    <section class="q" data-i="${i}" data-id="${item.id}">
      <div class="q-head"><span class="q-no">第 ${i + 1} 題</span><span class="tag">${esc(item.topic)}</span><span class="tag id">題庫 #${item.id}</span>${item.ctx.length ? '<span class="tag">有前情句</span>' : ""}</div>
      ${item.ctx.map(c => lineHTML("前情", c)).join("")}
      ${lineHTML("題目", item.q)}
      <div class="bar"><button class="play">▶ 播前情＋題目</button><input type="range" min="0" max="1000" value="0" step="1"><span class="t">0.0 / –</span></div>
      <div class="opts">${opts.map((o, j) => `
        <div class="opt ${o.kind === "ok" ? "right" : ""}" data-no="${no(o)}" data-kind="${o.kind}"><span class="k">${"ABC"[j]}</span>
          <button class="spk" data-src="${esc(o.s)}" title="播放這句">🔊</button>
          <div><div class="hk">${esc(o.h)}</div><div class="zh">${esc(o.m)}</div></div>
          <div class="side">
            <span class="kind ${o.kind}">${o.kind === "ok" ? "正解" : o.kind === "near" ? "近誘答" : `遠誘答 <small>(${esc(o.from)})</small>`}</span>
            ${o.kind === "ok" ? `<button class="mk wrong" data-m="wrong">✗ 這不是答案</button>` : `<button class="mk also" data-m="also">✓ 這也可以</button>`}
          </div></div>`).join("")}
      </div>
      <div class="qmarks"><span class="lbl">整題：</span>
        <button class="mk none" data-q="none">都不是答案</button>
        <button class="mk bad" data-q="bad">題目有問題</button>
        <input class="note" placeholder="備註（選填，例如：B 也說得通，因為……）">
        <div class="others"></div>
      </div>
    </section>`).join("");
  seqs = round.map(r => [...r.item.ctx, r.item.q].map(l => l.s));
  document.querySelectorAll(".q").forEach(paintQ);
}

// 依標記更新一題的樣子
function paintQ(box) {
  const id = box.dataset.id, m = marks[id] || { o: {} };
  box.classList.toggle("marked", !isEmpty(marks[id]));
  const shown = new Set();
  box.querySelectorAll(".opt").forEach(op => {
    const v = (m.o || {})[op.dataset.no]; shown.add(op.dataset.no);
    op.classList.toggle("m-wrong", v === "wrong"); op.classList.toggle("m-also", v === "also");
    op.querySelector(".mk").classList.toggle("on", !!v);
  });
  box.querySelector(".mk.none").classList.toggle("on", !!m.none);
  box.querySelector(".mk.bad").classList.toggle("on", !!m.bad);
  const note = box.querySelector(".note"); if (document.activeElement !== note) note.value = m.note || "";
  // 標過、但這次沒抽到的誘答：列出來，免得以為標記不見了
  const idx = lineIndex($("dia").value);
  const rest = Object.entries(m.o || {}).filter(([n, v]) => v === "also" && !shown.has(n));
  box.querySelector(".others").innerHTML = rest.length ? "之前標過「這也可以」（這次沒抽到）：" + rest.map(([n]) => {
    const r = idx.get(+n); return r ? `「${esc(r.L.h)}」` : `#${n}`;
  }).join("、") + ` <button class="mk" data-clear-others>清掉</button>` : "";
}

// ---- 匯出 ----
function exportText() {
  const ids = Object.keys(marks).map(Number).sort((a, b) => a - b);
  if (!ids.length) return "";
  const out = [`午休驅魔記 第一關題目標記（${ids.length} 題）`, ""];
  for (const id of ids) {
    const m = marks[id], dia = QUIZ[m.dia] ? m.dia : Object.keys(QUIZ)[0];
    const item = QUIZ[dia].find(x => x.id === id), idx = lineIndex(dia);
    if (!item) continue;
    const kindOf = n => n === no(item.a) ? "正解" : item.near.some(x => no(x) === n) ? "近誘答" : `遠誘答・${(idx.get(n) || {}).topic || "?"}`;
    out.push(`#${id}（${item.topic}）題目[句${no(item.q)}]：${item.q.h}／${item.q.m}　（標記時腔調：${dia}）`);
    if (item.ctx.length) out.push(`  前情：${item.ctx.map(c => `[句${no(c)}]${c.h}／${c.m}`).join("　")}`);
    out.push(`  正解[句${no(item.a)}]：${item.a.h}／${item.a.m}`);
    for (const [n, v] of Object.entries(m.o || {})) {
      const r = idx.get(+n), txt = r ? `${r.L.h}／${r.L.m}` : "";
      out.push(v === "wrong" ? `  ✗ 正解不對[句${n}]：${txt}` : `  ✓ 誘答也可以[句${n}]（${kindOf(+n)}）：${txt}`);
    }
    if (m.none) out.push("  ・都不是答案");
    if (m.bad) out.push("  ・題目有問題");
    if ((m.note || "").trim()) out.push(`  備註：${m.note.trim()}`);
    out.push("");
  }
  out.push("JSON：" + JSON.stringify(marks));
  return out.join("\n");
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { const t = $("dlgText"); t.focus(); t.select(); try { return document.execCommand("copy"); } catch { return false; } }
}
$("export").onclick = async () => {
  const text = exportText();
  $("dlgText").value = text || "（還沒有任何標記）";
  $("dlg").showModal();
  if (!text) { $("dlgMsg").textContent = "還沒有標記。"; return; }
  $("dlgMsg").textContent = (await copy(text)) ? "已複製到剪貼簿，直接貼到對話框給 Claude 就可以。" : "沒辦法自動複製，請全選下面的文字自己複製。";
};
$("dlgCopy").onclick = async () => { $("dlgMsg").textContent = (await copy($("dlgText").value)) ? "已複製。" : "請全選下面的文字自己複製。"; };
$("dlgClose").onclick = () => $("dlg").close();
$("clearAll").onclick = () => {
  if (!Object.keys(marks).length || !confirm("確定清除全部標記？（建議先按「複製標記給 Claude」留一份）")) return;
  marks = {}; save(); updateCount(); document.querySelectorAll(".q").forEach(paintQ);
};
$("onlyMarked").onchange = () => document.body.classList.toggle("onlyMarked", $("onlyMarked").checked);

// ---- 播放：全頁一個 Audio（同遊戲）----
const au = new Audio(), GAP = .45;
let seqs = [], cur = null;
const durCache = new Map();
const dur = src => durCache.has(src) ? Promise.resolve(durCache.get(src)) : new Promise(res => {
  const a = new Audio(); a.preload = "metadata"; a.src = AUDIO + src;
  a.onloadedmetadata = () => { durCache.set(src, a.duration); res(a.duration); }; a.onerror = () => { durCache.set(src, 0); res(0); };
});
function stop() {
  au.pause(); au.onended = null;
  document.querySelectorAll(".spk.on").forEach(b => b.classList.remove("on"));
  if (cur) { cancelAnimationFrame(cur.raf); clearTimeout(cur.to); const q = document.querySelector(`.q[data-i="${cur.i}"] .play`); if (q) q.textContent = "▶ 播前情＋題目"; cur = null; }
}
function playOne(btn) {
  const was = btn.classList.contains("on"); stop(); if (was) return;
  btn.classList.add("on"); au.src = AUDIO + btn.dataset.src; au.currentTime = 0; au.play().catch(() => {});
  au.onended = () => btn.classList.remove("on");
}
const total = c => c.segs.reduce((s, x) => s + x.dur, 0) + GAP * (c.segs.length - 1);
const startOf = (c, k) => c.segs.slice(0, k).reduce((s, x) => s + x.dur + GAP, 0);
async function playSeq(i, at = 0) {
  const keepPlaying = cur && cur.i === i && !at;
  stop(); if (keepPlaying) return;
  const segs = await Promise.all(seqs[i].map(async s => ({ src: s, dur: await dur(s) })));
  const c = cur = { i, segs, raf: 0, to: 0 };
  const box = document.querySelector(`.q[data-i="${i}"]`), range = box.querySelector("input[type=range]"), t = box.querySelector(".t");
  box.querySelector(".play").textContent = "■ 停止";
  const T = total(c);
  let k = 0; while (k < segs.length - 1 && at >= startOf(c, k + 1)) k++;
  const go = (k, off) => {
    if (cur !== c) return;
    c.k = k; au.src = AUDIO + segs[k].src; au.currentTime = Math.max(0, off); au.play().catch(() => {});
    au.onended = () => { if (k + 1 < segs.length) c.to = setTimeout(() => go(k + 1, 0), GAP * 1000); else { stop(); range.value = 1000; t.textContent = `${T.toFixed(1)} / ${T.toFixed(1)}`; } };
  };
  go(k, Math.min(at - startOf(c, k), segs[k].dur));
  const tick = () => {
    if (cur !== c) return;
    const now = startOf(c, c.k) + Math.min(au.currentTime, segs[c.k].dur);
    range.value = Math.round(now / T * 1000); t.textContent = `${now.toFixed(1)} / ${T.toFixed(1)}`;
    c.raf = requestAnimationFrame(tick);
  };
  tick();
}

$("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const box = b.closest(".q");
  if (b.classList.contains("spk")) return playOne(b);
  if (b.classList.contains("play")) return playSeq(+box.dataset.i);
  const id = box.dataset.id;
  if (b.dataset.m) {            // 選項：✗ 這不是答案／✓ 這也可以
    const m = markOf(id, true), n = b.closest(".opt").dataset.no;
    if (m.o[n]) delete m.o[n]; else m.o[n] = b.dataset.m;
  } else if (b.dataset.q) {     // 整題：都不是答案／題目有問題
    const m = markOf(id, true); m[b.dataset.q] = !m[b.dataset.q];
  } else if (b.hasAttribute("data-clear-others")) {
    const m = markOf(id), shown = new Set([...box.querySelectorAll(".opt")].map(o => o.dataset.no));
    if (m) for (const n of Object.keys(m.o)) if (!shown.has(n)) delete m.o[n];
  } else return;
  touch(id); paintQ(box);
});
$("list").addEventListener("input", e => {
  if (!e.target.classList.contains("note")) return;
  const box = e.target.closest(".q"), id = box.dataset.id;
  markOf(id, true).note = e.target.value; touch(id); box.classList.toggle("marked", !isEmpty(marks[id]));
});
$("list").addEventListener("change", async e => {   // 拖進度條：從那個位置開始播
  if (e.target.type !== "range") return;
  const i = +e.target.closest(".q").dataset.i;
  const segs = await Promise.all(seqs[i].map(async s => ({ src: s, dur: await dur(s) })));
  const at = e.target.value / 1000 * total({ segs });
  stop(); playSeq(i, Math.max(at, 0.001));
});
$("dia").onchange = $("lv").onchange = $("again").onclick = render;
$("hide").onchange = () => document.body.classList.toggle("hideAns", $("hide").checked);
updateCount();
render();
</script>
</body>
</html>
