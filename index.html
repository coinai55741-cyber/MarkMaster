<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聽聲應答＋符咒打殭屍｜原型</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #fffdf8; --ink: #2b2a27; --muted: #77726a; --line: #e2dccf;
    --brand: #2f6f5e; --brand-ink: #fff; --ok: #2e8b57; --ok-bg: #e5f4ea; --bad: #c0392b; --bad-bg: #fbe9e6;
    --font: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", "MingLiU-ExtB", "PMingLiU-ExtB", "SimSun-ExtB", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .field { margin-bottom: 18px; }
  .field > label { display: block; font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; cursor: pointer; font: inherit; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .hint { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .btn { border: 0; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 700; font-size: 18px; padding: 12px 24px; border-radius: 12px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
  .btn:disabled { opacity: .4; cursor: default; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar > i { display: block; height: 100%; background: var(--brand); transition: width .3s; }
  .listen { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 24px; }
  .stage { width: 280px; height: 300px; border-radius: 20px; background: radial-gradient(circle at 50% 85%, #e6efe2 0 38%, transparent 39%), #f1ecdf; overflow: hidden; }
  .stage canvas { display: block; width: 100% !important; height: 100% !important; }
  .stage:empty { display: none; }
  .play { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; font-size: 28px; cursor: pointer; box-shadow: 0 6px 16px rgba(47,111,94,.3); margin-top: -40px; position: relative; }
  .play.on { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .tag { font-size: 13px; background: #efe9dc; color: var(--muted); padding: 3px 10px; border-radius: 999px; }
  .prompt { text-align: center; min-height: 1.5em; }
  .prompt .h { font-size: 22px; font-weight: 700; }
  .prompt .m { color: var(--muted); font-size: 15px; }
  .ctx { color: var(--muted); font-size: 15px; margin-bottom: 4px; }
  .ctx .h::before { content: "前情："; font-size: 12px; }
  .ctx .m { margin-left: 8px; font-size: 13px; }
  .ctxnote { color: var(--muted); font-size: 14px; }
  .opts { display: grid; gap: 12px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; font: inherit; color: var(--ink); }
  .opt:hover:not(.done), .opt:focus-visible { border-color: var(--brand); outline: none; }
  .opt.done { cursor: default; }
  .opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #efe9dc; display: grid; place-items: center; font-weight: 700; }
  .opt .body { flex: 1; }
  .opt .h { font-size: 20px; line-height: 1.5; }
  .opt .p { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .opt .m { color: var(--muted); font-size: 14px; margin-top: 6px; display: none; }
  .opt.show-m .m { display: block; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .say { flex: none; border: 0; background: transparent; font-size: 20px; cursor: pointer; padding: 2px; }
  .feedback { text-align: center; font-size: 20px; font-weight: 700; min-height: 32px; margin: 16px 0 8px; }
  .feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
  .actions { text-align: center; }
  .score { font-size: 64px; font-weight: 800; text-align: center; color: var(--brand); margin: 8px 0; }
  .review { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 10px; }
  .review li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .review .r { display: flex; gap: 8px; align-items: baseline; }
  .review .m { color: var(--muted); font-size: 14px; }
  .err { color: var(--bad); font-size: 14px; }
  .stage2 { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 50; background: #0d1630; }
  .split { display: flex; justify-content: center; gap: 24px; color: var(--muted); margin: -4px 0 8px; }
  .split b { color: var(--ink); font-size: 20px; }
  .review li.head { background: none; border: 0; padding: 12px 0 0; font-weight: 700; }
  .review .tone { display: flex; justify-content: space-between; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 開始畫面 -->
  <section id="start">
    <h1>聽聲應答</h1>
    <p class="sub">第一關「聽聲應答」：聽一句客語，從三句客語裡選出最適合的回答，共 7 題、70 分。<br>第二關「符咒打殭屍」：照殭屍額頭上字的聲調畫一筆把它封印，共 3 波、30 分。</p>
    <div class="panel">
      <div class="field">
        <label>腔調</label>
        <div class="chips" id="dialects"></div>
      </div>
      <div class="field">
        <label>難度</label>
        <div class="chips" id="levels"></div>
        <div class="hint" id="levelHint"></div>
      </div>
      <div class="field">
        <label>選項顯示</label>
        <div class="chips"><button class="chip" id="pinyinToggle" aria-pressed="false">同時顯示拼音</button></div>
      </div>
      <button class="btn" id="startBtn">開始</button>
    </div>
  </section>

  <!-- 作答畫面 -->
  <section id="game" hidden>
    <div class="top"><span id="progress"></span><span id="scoreNow"></span></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="listen">
      <div class="stage" id="stage"></div>
      <button class="play" id="playQ" aria-label="播放題目">🔊</button>
      <span class="tag" id="topic"></span>
      <div class="prompt" id="prompt"></div>
      <div class="err" id="audioErr"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn" id="nextBtn" hidden>下一題</button></div>
  </section>

  <!-- 結算畫面 -->
  <section id="result" hidden>
    <h1>結算</h1>
    <div class="score" id="finalScore"></div>
    <div class="split"><span>聽聲應答 <b id="s1"></b> / 70</span><span>符咒打殭屍 <b id="s2"></b> / 30</span></div>
    <p class="sub" id="finalNote" style="text-align:center"></p>
    <ul class="review" id="review"></ul>
    <div class="actions" style="display:flex;gap:12px;justify-content:center">
      <button class="btn" id="againBtn">再玩一次</button>
      <button class="btn ghost" id="homeBtn">換腔調／難度</button>
    </div>
  </section>

</div>
<script src="data.js"></script>
<script src="avatar/vector-avatar.js"></script>
<script src="avatar/shisa.js"></script>
<script>
const ROUND = 7;          // 第一關 7 題 × 10 分；第二關（zombie_tone.html）30 分
const LEVELS = {
  easy: { name: "初級", hint: "錯誤選項來自其他情境，聽懂大概意思就能排除。" },
  mid:  { name: "中級", hint: "一個錯誤選項來自同一段對話，一個來自其他情境。" },
  hard: { name: "進階", hint: "兩個錯誤選項都來自同一段對話，要真的聽懂問題。" },
};
const state = { dialect: "四縣腔", level: "easy", pinyin: false, qs: [], i: 0, score: 0, log: [], tone: null };
const $ = id => document.getElementById(id);
const audio = new Audio();

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- 獅子（vector-avator）----
let lion = null;
async function initLion() {
  if (lion || !window.VectorAvatar || !window.SHISA_VECTOR) return;
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(SHISA_VECTOR)], { type: "application/json" }));
    lion = await VectorAvatar.Avatar.create($("stage"), { vectorUrl: url, width: 560, height: 600, idle: "idle" });
  } catch (e) { console.error("角色載入失敗", e); lion = null; $("stage").innerHTML = ""; }
}
const toKeys = k => (k || []).map(([t, mouth]) => ({ t, mouth }));

// 播一句話；有對嘴資料就讓獅子跟著音檔動嘴。onDone：播完後接著做的事（用來連播前情句）
function play(src, btn, keys, onDone) {
  $("audioErr").textContent = "";
  audio.onended = audio.onpause = null;
  document.querySelectorAll(".play.on").forEach(b => b.classList.remove("on"));
  audio.pause();
  if (!src) return;
  audio.src = src;
  if (btn) btn.classList.add("on");
  audio.onpause = () => btn && btn.classList.remove("on");
  audio.onended = () => { btn && btn.classList.remove("on"); if (onDone) setTimeout(onDone, 450); };
  audio.onerror = () => { btn && btn.classList.remove("on"); $("audioErr").textContent = "音檔載入失敗，請檢查網路後再按一次。"; };
  audio.play().then(() => { if (lion && keys) lion.speak(audio, toKeys(keys)); }).catch(() => {});
}
// 依序播多句（前情句 → 問句）；中途按別的播放會打斷
function playSeq(lines, btn) {
  const go = i => i < lines.length && play(lines[i].s, btn, lines[i].k, () => go(i + 1));
  go(0);
}
const ctxHtml = item => item.ctx.map(c => `<div class="ctx"><span class="h">${esc(c.h)}</span><span class="m">${esc(c.m)}</span></div>`).join("");

// ---- 開始畫面 ----
function chips(el, items, current, onPick) {
  el.innerHTML = "";
  items.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label; b.setAttribute("aria-pressed", key === current);
    b.onclick = () => { onPick(key); [...el.children].forEach(c => c.setAttribute("aria-pressed", c === b)); };
    el.appendChild(b);
  });
}
chips($("dialects"), Object.keys(QUIZ).map(d => [d, d]), state.dialect, d => state.dialect = d);
chips($("levels"), Object.entries(LEVELS).map(([k, v]) => [k, v.name]), state.level, k => { state.level = k; $("levelHint").textContent = LEVELS[k].hint; });
$("levelHint").textContent = LEVELS[state.level].hint;
$("pinyinToggle").onclick = e => { state.pinyin = !state.pinyin; e.target.setAttribute("aria-pressed", state.pinyin); };

// ---- 出題 ----
function buildRound() {
  const bank = QUIZ[state.dialect];
  return pick(bank, ROUND).map(item => {
    const far = bank.filter(x => x.decoy && x.topic !== item.topic && x.a.h !== item.a.h).map(x => x.a);
    let wrong;
    if (state.level === "hard") wrong = item.near.slice();
    else if (state.level === "mid") wrong = [pick(item.near, 1)[0], pick(far, 1)[0]];
    else wrong = pick(far, 2);
    const opts = shuffle([{ ...item.a, right: true }, ...wrong.map(w => ({ ...w, right: false }))]);
    return { item, opts };
  });
}

async function start() {
  Object.assign(state, { qs: buildRound(), i: 0, score: 0, log: [], tone: null });
  show("game");
  await initLion();
  if (lion) lion.play("mb_wave");
  renderQ();
}

function show(id) { ["start", "game", "result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }

function renderQ() {
  const { item, opts } = state.qs[state.i];
  $("progress").textContent = `第 ${state.i + 1} / ${ROUND} 題`;
  $("scoreNow").textContent = `${state.score} 分`;
  $("barFill").style.width = `${state.i / ROUND * 100}%`;
  $("topic").textContent = item.topic;
  $("prompt").innerHTML = "";
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("nextBtn").hidden = true;
  const seq = [...item.ctx, item.q];
  $("playQ").onclick = () => playSeq(seq, $("playQ"));
  if (item.ctx.length) $("prompt").innerHTML = `<div class="ctxnote">這題會先播前一句對話，再播問句</div>`;
  if (lion) lion.setExpression("neutral");
  const box = $("opts"); box.innerHTML = "";
  opts.forEach((o, n) => {
    const b = document.createElement("div");
    b.innerHTML = `<div class="opt" role="button" tabindex="0"><span class="k">${"ABC"[n]}</span><span class="body"><div class="h">${esc(o.h)}</div>${state.pinyin ? `<div class="p">${esc(o.p)}</div>` : ""}<div class="m">${esc(o.m)}</div></span></div>`;
    const btn = b.firstChild;
    btn.onclick = () => answer(n);
    btn.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); btn.click(); } };
    o.el = btn;
    box.appendChild(btn);
  });
  playSeq(seq, $("playQ"));
}

function answer(n) {
  const cur = state.qs[state.i];
  const chosen = cur.opts[n];
  const right = chosen.right;
  if (right) state.score += 10;
  state.log.push({ item: cur.item, chosen, right });
  cur.opts.forEach(o => {
    o.el.classList.add("show-m", "done"); o.el.onclick = o.el.onkeydown = null; o.el.removeAttribute("role"); o.el.removeAttribute("tabindex");
    if (o.right) o.el.classList.add("ok"); else if (o === chosen) o.el.classList.add("bad");
    // 作答後，每個選項都可以點喇叭聽
    const s = document.createElement("button");
    s.className = "say"; s.textContent = "🔈"; s.title = "聽這句";
    s.onclick = e => { e.stopPropagation(); play(o.s, null, o.k); };
    o.el.appendChild(s);
  });
  $("prompt").innerHTML = `${ctxHtml(cur.item)}<div class="h">${esc(cur.item.q.h)}</div><div class="m">${esc(cur.item.q.m)}</div>`;
  $("feedback").textContent = right ? "答對了！" : "再想想，正確答案是綠色那句。";
  $("feedback").className = "feedback " + (right ? "ok" : "bad");
  $("scoreNow").textContent = `${state.score} 分`;
  $("nextBtn").textContent = state.i + 1 < ROUND ? "下一題" : "進入第二關";
  $("nextBtn").hidden = false;
  if (lion) {
    lion.setExpression(right ? "smile" : "troubled");
    lion.play(right ? "spread" : "think");
  }
  play(cur.item.a.s, null, cur.item.a.k);
}

$("nextBtn").onclick = () => { audio.pause(); state.i++; state.i < ROUND ? renderQ() : stage2(); };

// ---- 第二關：符咒打殭屍（整頁 iframe，打完用 postMessage 回傳分數）----
function stage2() {
  const f = document.createElement("iframe");
  f.className = "stage2"; f.id = "stage2"; f.allow = "autoplay";
  f.src = `zombie_tone.html?embedded&dialect=${encodeURIComponent(state.dialect)}&level=${state.level}`;
  document.body.appendChild(f);
}
addEventListener("message", e => {
  if (!e.data || e.data.type !== "zombie-complete" || !$("stage2")) return;
  state.tone = e.data;
  $("stage2").remove();
  finish();
});

function finish() {
  show("result");
  const tone = state.tone ? state.tone.score : 0;
  $("finalScore").textContent = (state.score + tone).toFixed(2);
  $("s1").textContent = state.score; $("s2").textContent = tone.toFixed(2);
  const n = state.log.filter(l => l.right).length;
  $("finalNote").textContent = `${state.dialect}・${LEVELS[state.level].name}・聽聲應答答對 ${n} / ${ROUND} 題`;
  const ul = $("review"); ul.innerHTML = "";
  state.log.forEach((l, i) => {
    const li = document.createElement("li");
    li.innerHTML = `${ctxHtml(l.item)}<div class="r"><strong>${l.right ? "✅" : "❌"} ${i + 1}.</strong><span>${esc(l.item.q.h)}</span></div>
      <div class="m">${esc(l.item.q.m)}</div>
      <div class="r" style="margin-top:6px">→ <span>${esc(l.item.a.h)}</span></div>
      ${l.right ? "" : `<div class="m">你選的：${esc(l.chosen.h)}</div>`}`;
    const s = document.createElement("button");
    s.className = "say"; s.textContent = "🔈 問句"; s.style.fontSize = "14px";
    s.onclick = () => play(l.item.q.s, null, l.item.q.k);
    const s2 = s.cloneNode(true); s2.textContent = "🔈 回答"; s2.onclick = () => play(l.item.a.s, null, l.item.a.k);
    li.append(s, s2);
    ul.appendChild(li);
  });
  if (state.tone) {
    const h = document.createElement("li"); h.className = "head"; h.textContent = "符咒打殭屍：每個字的精準度"; ul.appendChild(h);
    state.tone.rows.forEach(r => {
      const li = document.createElement("li"); li.className = "tone";
      li.innerHTML = `<span>${esc(r.ch)}　${esc(r.syl)}　<span class="m">本調 ${esc(r.base)}</span></span><b>${r.breach ? "衝過防線" : (r.s * 100).toFixed(1) + "%"}</b>`;
      ul.appendChild(li);
    });
  }
}

$("startBtn").onclick = start;
$("againBtn").onclick = start;
$("homeBtn").onclick = () => { audio.pause(); show("start"); };
</script>
</body>
</html>
